name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # triggers on tags like 1.0.0, 1.2.3

permissions:
  contents: write

jobs:
  build-launcher:
    name: Build & Release LauncherApp
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish (self-contained, single-file)
        run: |
          dotnet publish src/LauncherApp/LauncherApp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "${{ github.workspace }}\installer\publish" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            --nologo

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $publishDir = "${{ github.workspace }}\installer\publish"
          $outputDir  = "${{ github.workspace }}\installer\Output"
          $issFile    = "${{ github.workspace }}\installer\RocketLaunch.iss"

          Write-Host "Publish dir: $publishDir"
          Get-ChildItem $publishDir | Select-Object Name, Length

          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
              /DPublishDir="$publishDir" `
              /DOutputDir="$outputDir" `
              $issFile

          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/RocketLaunch-Setup.exe
          generate_release_notes: true
          name: "RocketLaunch ${{ github.ref_name }}"
